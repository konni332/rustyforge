[package]
name = "rustyforge"
version = "0.4.1"
authors = ["konni332"]
edition = "2024"
description = "A fast build tool for C, written in Rust"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/konni332/rustyforge"
keywords = ["cli", "build", "C", "tool"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[[bin]]
name = "rustyforge"
path = "src/main.rs"

[lib]
name = "rustyforge_core"
path = "src/lib.rs"

[features]
default = ["term-colors"]
term-colors = []

[dependencies]
serde = { version = "1.0", features = ["derive"]}
toml = "0.9"
clap = { version = "4.5", features = ["derive"]}
sha2 = "0.10"
serde_json = "1.0"
colored = "3.0"
rayon = "1.11"
anyhow = "1.0"
globset = "0.4"
walkdir = "2.5"
crossterm = "0.29"
tempfile = "3.24"
which = "8"
dirs-next = "2"
twox-hash = "2.1"
verbosio = "0.3"
postcard = { version = "1.1", features = ["alloc"] }
