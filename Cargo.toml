[package]
name = "rustyforge"
version = "0.4.1"
authors = ["konni332"]
edition = "2024"
description = "A fast build tool for C, written in Rust"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/konni332/rustyforge"
keywords = ["cli", "build", "C", "tool"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[[bin]]
name = "rustyforge"
path = "src/main.rs"

[lib]
name = "rustyforge_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
toml = "0.9"
clap = { version = "4.5", features = ["derive"]}
clap-verbosity-flag = "3.0"
rayon = "1.11"
globset = "0.4"
jwalk = "0.8"
tempfile = "3.24"
which = "8"
dirs-next = "2"
twox-hash = "2.1"
postcard = { version = "1.1", features = ["alloc"] }
indicatif = "0.18"
color-eyre = "0.6"
thiserror = "2.0"
miette = { version = "7.6", features = ["fancy"] }
verbosio = "0.3"
atty = "0.2"
anstream = { version = "0.6", features = ["auto"] }
anstyle = "1.0"
annotate-snippets = "0.12.10"
windows-sys = { version = "0.61", features = ["Win32", "Win32_Storage_FileSystem", "Win32_System_Console"] }
libc = "0.2"
