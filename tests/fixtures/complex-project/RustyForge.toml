[package]
name = "complex-project"
version = "0.1.0"
c-edition = "c11"
cpp-edition = "c++17"


[[bin]]
name = "bin-a"
entry = "src/main.c"
ignore = ["tests"]

[[bin]]
name = "bin-b"
entry = "src/main.cpp"
ignore = ["tests"]
defines = ["CUSTOM_DEFINE"]

[lib]
type = "shared"
name = "mylib"
ignore = ["src", "tests"]

[profile.dev]
flags = ["-Wall", "-Wextra"]

[build]
